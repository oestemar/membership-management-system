<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード確認</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="content">
        <h2>{{ title }}</h2>
        <p>会員 ID: {{ user.id }} のパスワードを入力してください。</p>
        <form action="{{ form_action }}" method="POST">
            <input type="hidden" name="action" value="verify_member_password">
            <label>会員パスワード：</label>
            <input type="password" name="member_password" required>
            <button type="submit">{{ button_text }}</button>
        </form>
        <form action="{{ url_for('main.admin_user_detail', id=user.id) }}" method="GET">
            <button type="submit">戻る</button>
        </form>
    </main>
</body>
</html>
